<title>لِسان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
html{direction:rtl}
/* ================= لسان — النظام البصري ================= */
:root{
  --bg:#F4F7F6; --card:#FFFFFF; --ink:#13221E; --muted:#5F6F6B; --line:#E2E8E6; --soft:#EEF3F1;
  --pri:#0E9F7E; --pri-d:#0A7560; --pri-l:#DDF5EC;
  --acc:#FFB020; --acc-d:#C98300; --bad:#E5484D; --bad-d:#B3363A;
  --okbg:#DDF5EC; --badbg:#FDE8E8; --gold:#F5B400;
  --t-s:#2F80ED; --t-v:#E8710A; --t-x:#E5484D; --t-o:#0E9F7E; --t-t:#0A97A8; --t-q:#8E5CF7; --t-p:#D6409F;
  --sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(16,40,34,.07);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E1513; --card:#16211E; --ink:#E6EFEC; --muted:#97A8A3; --line:#26342F; --soft:#1C2926;
  --pri-d:#08624F; --pri-l:#123B30; --okbg:#103A2E; --badbg:#3D1B1D;
  --t-s:#6AA6FF; --t-v:#FF9A45; --t-x:#FF6B70; --t-o:#2FD3A6; --t-t:#35C6D8; --t-q:#B08DFF; --t-p:#F071BC;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --card:#16211E; --ink:#E6EFEC; --muted:#97A8A3; --line:#26342F; --soft:#1C2926;
    --pri-d:#08624F; --pri-l:#123B30; --okbg:#103A2E; --badbg:#3D1B1D;
    --t-s:#6AA6FF; --t-v:#FF9A45; --t-x:#FF6B70; --t-o:#2FD3A6; --t-t:#35C6D8; --t-q:#B08DFF; --t-p:#F071BC;
    --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.6}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
.en,[dir="ltr"]{font-family:"Nunito","Segoe UI",system-ui,sans-serif}
bdi.en{unicode-bidi:isolate}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;line-height:1.35}

/* ---------- الأزرار ---------- */
.btn{display:block;width:100%;border-radius:16px;padding:14px 18px;font-weight:700;font-size:17px;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-d);transition:transform .08s,box-shadow .08s,background .2s;margin-top:10px;text-align:center}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default}
.btn.ghost{background:transparent;color:var(--pri);box-shadow:none;border:2px solid var(--line)}
.btn.ghost:active{transform:translateY(1px)}
.btn.acc{background:var(--acc);box-shadow:0 4px 0 var(--acc-d);color:#3A2600}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn.sm{padding:10px 14px;font-size:15px;border-radius:12px;margin-top:0;width:auto;display:inline-block}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.icon-btn:hover{background:var(--soft)}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--sh);border:1px solid var(--line)}

/* ---------- شاشة الملفات ---------- */
.prof-scr{padding:32px 16px 40px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:34px;font-weight:700;color:var(--pri)}
.logo img{width:52px;height:52px;border-radius:14px}
.tagline{color:var(--muted);margin:6px 0 28px}
.prof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-bottom:18px}
.prof{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.prof:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.prof .av{font-size:46px;line-height:1.1}
.prof b{font-size:17px}
.prof small{color:var(--muted);font-size:13px}
.prof.add{border-style:dashed;justify-content:center;color:var(--pri);font-weight:700;box-shadow:none}
.prof.add .av{font-size:34px}

/* ---------- نماذج ---------- */
.form{padding:20px 16px 40px}
.form h2{font-size:24px;margin:8px 0 6px}
.form p{color:var(--muted);margin:0 0 18px}
.field{display:block;margin:18px 0 8px;font-weight:700}
.inp{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:18px;outline:none}
.inp:focus{border-color:var(--pri)}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.av-grid button{font-size:30px;aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.av-grid button.sel{border-color:var(--pri);background:var(--pri-l)}
.goal-list{display:grid;gap:10px}
.goal{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:600}
.goal.sel{border-color:var(--pri);background:var(--pri-l)}
.goal small{color:var(--muted);font-weight:400}
.choice-big{display:flex;gap:14px;align-items:center;text-align:start;padding:18px;border-radius:18px;border:2px solid var(--line);background:var(--card);width:100%;margin-top:12px;box-shadow:0 4px 0 var(--line)}
.choice-big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice-big .ic{font-size:36px}
.choice-big b{display:block;font-size:18px}
.choice-big span{color:var(--muted);font-size:14px}

/* ---------- الواجهة الرئيسية ---------- */
.home{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.stat{display:flex;align-items:center;gap:4px;font-weight:700;font-size:16px;padding:6px 10px;border-radius:12px}
.stat:hover{background:var(--soft)}
.stat.flame{color:#F07A12}.stat.flame.off{color:var(--muted);filter:grayscale(1)}
.stat.gem{color:#1E9BD7}.stat.heart{color:var(--bad)}
.stat .n{font-family:"Nunito",sans-serif}
.lvl-chip{display:flex;align-items:center;gap:6px;font-weight:700;padding:6px 10px;border-radius:12px;border:2px solid var(--line)}
.tab-body{flex:1;padding:16px 16px 110px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0 10px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button .ti{font-size:24px;line-height:1.3;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--pri)}
.tabs button.on .ti{filter:none;opacity:1}

/* بطاقة الهدف اليومي */
.goal-card{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring>span{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px}
.goal-card b{display:block;font-size:17px}
.goal-card small{color:var(--muted)}
.cta-card{display:flex;align-items:center;gap:14px;margin-bottom:16px;background:linear-gradient(135deg,var(--pri),#14B88F);color:#fff;border:0;width:100%;text-align:start}
.cta-card .ic{font-size:38px}
.cta-card b{display:block;font-size:17px}
.cta-card small{opacity:.9}

/* الوحدات والمسار */
.unit{margin:8px 0 26px}
.uhead{background:var(--uc);color:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 4px 0 color-mix(in srgb,var(--uc) 70%,#000);display:flex;justify-content:space-between;align-items:center;gap:10px}
.uhead small{opacity:.9;font-weight:600}
.uhead h3{font-size:19px}
.uhead p{margin:2px 0 0;opacity:.92;font-size:14px}
.uhead .gbtn{background:rgba(255,255,255,.2);border-radius:12px;padding:8px 10px;font-size:20px;flex:none}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0 4px}
.nodewrap{position:relative;display:flex;flex-direction:column;align-items:center;width:120px}
.node{width:74px;height:70px;border-radius:50%;font-size:30px;display:grid;place-items:center;background:var(--uc);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--uc) 65%,#000);transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--uc) 65%,#000)}
.node.done{background:var(--gold);box-shadow:0 6px 0 #C48F00;font-size:32px;font-weight:900}
.node.skip{background:color-mix(in srgb,var(--gold) 55%,var(--card));box-shadow:0 6px 0 color-mix(in srgb,#C48F00 55%,var(--line));font-size:26px}
.node.lock{background:var(--line);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 70%,#000);font-size:24px;filter:grayscale(1)}
.node.cur{outline:6px solid color-mix(in srgb,var(--uc) 30%,transparent);outline-offset:4px;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{outline-offset:4px}50%{outline-offset:9px}}
.nlabel{font-size:13px;color:var(--muted);margin-top:10px;text-align:center;line-height:1.3;font-weight:600}
.start-tag{position:absolute;top:-30px;background:var(--card);border:2px solid var(--line);color:var(--pri);font-weight:800;padding:2px 12px;border-radius:10px;font-size:14px;animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.soon{text-align:center;padding:26px 18px;border:2px dashed var(--line);border-radius:20px;color:var(--muted)}
.soon b{display:block;color:var(--ink);font-size:17px}

/* ---------- لوحة سفلية ---------- */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-wrap.on{opacity:1}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .2s;text-align:center;max-height:88vh;overflow:auto}
.sheet-wrap.on .sheet{transform:none}
.sh-ic{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;font-size:38px;margin:0 auto 10px;color:#fff}
.sheet h3{font-size:21px}
.sheet .cf{font-size:18px;font-weight:600;margin:6px 0 10px}

/* ---------- التنبيه ---------- */
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-200%);visibility:hidden;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:200;font-weight:600;transition:transform .25s;max-width:92vw;text-align:center;box-shadow:var(--sh)}
#toast.on{transform:translate(-50%,0);visibility:visible}

/* ---------- الجلسة (درس / مراجعة) ---------- */
.ses{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.ses-top{display:flex;align-items:center;gap:10px;padding:12px 14px;position:sticky;top:0;background:var(--bg);z-index:5}
.pbar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3FD3A8,var(--pri));border-radius:99px;transition:width .45s cubic-bezier(.3,1.4,.6,1)}
.hc{font-weight:800;color:var(--bad);display:flex;gap:4px;align-items:center;font-family:"Nunito",sans-serif}
.ses-body{flex:1;padding:6px 16px 24px;animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.q{font-size:21px;font-weight:700;margin:6px 0 16px}
.big{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-radius:18px;margin-bottom:18px}
.big.ar{font-size:22px}
.big .en{font-weight:800}
.spk{width:44px;height:44px;flex:none;border-radius:14px;background:var(--t-s);color:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 color-mix(in srgb,var(--t-s) 65%,#000)}
.spk.sm{width:34px;height:34px;font-size:15px;border-radius:10px}
.spk:active{transform:translateY(2px);box-shadow:none}
.audio-row{display:flex;gap:14px;justify-content:center;margin:10px 0 22px}
.spk.xl{width:96px;height:96px;font-size:42px;border-radius:26px}
.spk.slow{width:64px;height:64px;font-size:26px;border-radius:20px;align-self:end;background:var(--t-q);box-shadow:0 3px 0 color-mix(in srgb,var(--t-q) 65%,#000)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:600;box-shadow:0 3px 0 var(--line);transition:all .1s}
.opt .k{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted);font-family:"Nunito",sans-serif}
.opt.sel{border-color:var(--t-s);background:color-mix(in srgb,var(--t-s) 12%,var(--card));box-shadow:0 3px 0 var(--t-s)}
.opt.sel .k{border-color:var(--t-s);color:var(--t-s)}
.opt.right{border-color:var(--pri);background:var(--okbg);box-shadow:0 3px 0 var(--pri)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);box-shadow:0 3px 0 var(--bad)}
.locked .opt,.locked .tile,.locked .chip{pointer-events:none}

/* إكمال الفراغ */
.fill-s{font-size:23px;font-weight:700;line-height:2.1;padding:16px;background:var(--card);border:2px solid var(--line);border-radius:18px;text-align:left}
.slot{display:inline-block;min-width:84px;border-bottom:3px solid var(--t-s);text-align:center;color:var(--t-s);padding:0 6px;margin:0 4px}
.fill-ar{color:var(--muted);margin:10px 4px 18px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:19px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.chip.sel{border-color:var(--t-s);color:var(--t-s);box-shadow:0 3px 0 var(--t-s)}

/* ترتيب الكلمات */
.ans{min-height:118px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;direction:ltr;margin-bottom:22px;background:repeating-linear-gradient(transparent 0 54px,var(--line) 54px 56px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.tile{padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:700;box-shadow:0 3px 0 var(--line);font-family:"Nunito",sans-serif;transition:transform .08s}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile.used{background:var(--line);color:transparent;box-shadow:none;pointer-events:none}

/* المطابقة */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:10px;align-content:start}
.mbtn{padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:17px;font-weight:700;box-shadow:0 3px 0 var(--line);min-height:58px}
.mbtn.sel{border-color:var(--t-s);background:color-mix(in srgb,var(--t-s) 12%,var(--card));box-shadow:0 3px 0 var(--t-s)}
.mbtn.ok{border-color:var(--line);color:var(--muted);opacity:.45;box-shadow:none;pointer-events:none;background:var(--soft)}
.mbtn.bad{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* الكتابة والنطق */
.write-inp{width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:22px;font-weight:700;outline:none;text-align:left}
.write-inp:focus{border-color:var(--t-s)}
.mic{width:110px;height:110px;border-radius:50%;font-size:46px;background:var(--bad);color:#fff;display:grid;place-items:center;margin:22px auto 12px;box-shadow:0 6px 0 var(--bad-d)}
.mic.rec{animation:recp 1s infinite}
@keyframes recp{50%{box-shadow:0 6px 0 var(--bad-d),0 0 0 16px color-mix(in srgb,var(--bad) 25%,transparent)}}
.heard{text-align:center;color:var(--muted);min-height:28px}
.heard .en{color:var(--ink);font-weight:700}

/* شريط الإجابة */
.ses-foot{position:sticky;bottom:0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--line);z-index:5}
.ses-foot .btn{margin-top:0}
.foot-row{display:flex;gap:10px}
.foot-row .btn{flex:1}
.foot-row .btn.ghost{flex:0 0 auto;width:auto}
.fb:empty{display:none}
.fb{margin-bottom:12px;animation:fadein .2s}
.fb-t{font-size:20px;font-weight:800}
.fb-a{font-size:18px;font-weight:700;margin-top:2px}
.fb-n{font-size:15px;margin-top:6px;opacity:.9}
.ses-foot.ok{background:var(--okbg);border-color:transparent}
.ses-foot.ok .fb-t{color:var(--pri)}
.ses-foot.bad{background:var(--badbg);border-color:transparent}
.ses-foot.bad .fb-t,.ses-foot.bad .fb-a{color:var(--bad)}
.ses-foot.bad .btn{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}

/* ---------- القواعد ---------- */
.g-wrap{padding:6px 16px 24px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:var(--sh);animation:fadein .25s}
.gcard h2{font-size:22px;margin-bottom:10px;color:var(--pri)}
.gbody{font-size:17px;line-height:1.95}
.gbody i,.formula .tk,.exl .en-l{font-style:normal;font-family:"Nunito",sans-serif}
.gbody i{direction:ltr;unicode-bidi:isolate;font-weight:800;color:var(--t-s)}
.gbody table{width:100%;border-collapse:separate;border-spacing:0;margin:12px 0 4px;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:16px}
.gbody td,.gbody th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start}
.gbody tr:last-child td{border-bottom:0}
.gbody th{background:var(--soft);font-size:14px;color:var(--muted)}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:16px 0 4px;padding:12px;background:var(--soft);border-radius:14px;justify-content:center}
.formula b{color:var(--muted)}
.formula .tk{padding:6px 12px;border-radius:10px;color:#fff;font-weight:700;font-size:15px}
.exs{display:grid;gap:10px;margin-top:16px}
.exl{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--soft)}
.en-l{font-size:19px;font-weight:700;direction:ltr;text-align:left;line-height:1.9}
.ar-l{color:var(--muted);font-size:15px}
.tkw{border-radius:7px;padding:0 4px;font-weight:800;border-bottom:3px solid}
.t-s{--c:var(--t-s)}.t-v{--c:var(--t-v)}.t-x{--c:var(--t-x)}.t-o{--c:var(--t-o)}.t-t{--c:var(--t-t)}.t-q{--c:var(--t-q)}.t-p{--c:var(--t-p)}
.tkw{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.formula .tk{background:var(--c)}

const plain = s => s.replace(/\[([^|\]]+)\|\w\]/g, '$1');

/* ---------------- المراجعة الذكية ---------------- */
function reviewEx(k, p) {
  const v = VMAP[k] ? [k, VMAP[k].ar] : [k, k]; const box = p.srs[k].box;
  const types = box >= 3 ? ['write', 'listen', 'enar', 'aren'] : ['aren', 'enar', 'listen', 'aren'];
  const t = pick(types);
  return t === 'write' ? exWrite(v) : t === 'listen' ? exListenWord(v) : t === 'enar' ? exMcEnAr(v) : exMcArEn(v);
}
function startReview() {
  const p = P(); const keys = Object.keys(p.srs);
  if (!keys.length) return toast('أكمل درساً أولاً لتظهر كلماتك هنا');
  const t = today(); let due = shuffle(keys.filter(k => p.srs[k].due <= t)).slice(0, 12);
  if (due.length < 6) due = due.concat(shuffle(keys.filter(k => !due.includes(k))).sort((a, b) => p.srs[a].box - p.srs[b].box).slice(0, 6 - due.length));
  runSession({ mode: 'review', exercises: shuffle(due.map(k => reviewEx(k, p))), onDone: s => {
    const before = todayXP(p); const xp = 5 + Math.round(due.length * s.acc / 100); addXP(p, xp); p.stats.reviews++;
    refreshHearts(p); const gained = !p.settings.unlimited && p.hearts < HEART_MAX; if (gained) p.hearts++;
    const badges = checkBadges(p); save();
    resultScreen({ icon: '🧠', title: 'أنهيت المراجعة!', sub: gained ? 'كسبت قلباً ❤️ +1' : 'ذاكرتك تتقوّى يوماً بعد يوم', xp, acc: s.acc, secs: s.secs, badges, goalBefore: before });
  } });
}

function runPlacement() {
  leave(); const sets = LV.map(l => shuffle(C.placement[l])); const score = [0, 0, 0, 0], asked = [0, 0, 0, 0]; let li = 0, qi = 0; const N = 6, PASS = 5; const maxQ = N * 4; let n = 0;
  function draw() {

    app.innerHTML = `<div class="ses"><div class="ses-top"><button class="icon-btn" data-x aria-label="خروج">✕</button><div class="pbar"><i style="width:${n / maxQ * 100}%"></i></div><span class="pill">${LV[li]}</span></div>

  const level = ['A1', 'A2', 'B1', 'B1+', 'B2+'][passed];

  const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json,.json';
  i.onchange = () => { const f = i.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const j = JSON.parse(r.result); const d = j.data || j; if (!d || !Array.isArray(d.profiles)) throw 0;
      confirmBox(`استيراد ${d.profiles.length} ملف؟ سيُستبدل كل ما على هذا الجهاز.`, () => { d.profiles.forEach(fixProfile); DB = d; DB.current = null; save(); toast('✅ تمت الاستعادة'); go('profiles'); }, 'استيراد');
    } catch (e) { toast('❌ الملف غير صالح'); } };
    r.readAsText(f); };
  i.click();
}

/* ---------------- الموجّه ---------------- */
function go(scr, arg) {
  if (CLOUD.pending) { const d = CLOUD.pending; CLOUD.pending = null; if (d.updated > (DB.updated || 0)) cloudApply(d); }
  if (scr === 'profiles') return scrProfiles();
  if (scr === 'home') return P() ? scrHome(arg) : scrProfiles();
}
window.__lisan = { cur: null, get DB() { return DB; }, LESSONS, go };

applyTheme();
go(DB.current && P() ? 'home' : 'profiles');
cloudInit();
if (!IN_CLAUDE && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
})();

</script>
